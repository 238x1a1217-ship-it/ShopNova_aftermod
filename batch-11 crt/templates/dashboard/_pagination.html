{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}" aria-label="Previous page">← Previous</a>{% else %}<span class="pagination-disabled">← Previous</span>{% endif %}
    <span>Page <strong>{{ page_obj.number }}</strong> of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}" aria-label="Next page">Next →</a>{% else %}<span class="pagination-disabled">Next →</span>{% endif %}
  </nav>
{% endif %}
