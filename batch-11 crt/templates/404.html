{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="section container">
  <div class="empty-state error-state">
    <span class="empty-icon" aria-hidden="true">?</span>
    <span class="eyebrow">404 · Page not found</span>
    <h1>We couldn’t find that page.</h1>
    <p>The page may have moved, or the link may be out of date. Let’s get you back to the good stuff.</p>
    <a class="button" href="{% url 'product_list' %}">Back to the shop <span aria-hidden="true">→</span></a>
  </div>
</section>
{% endblock %}
